<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d081c">
<title>Chainpop</title>
<style>
:root{
  --bg:#0d081c;--dot:#231845;--panel:#171030;--panel2:#211742;
  --ink:#f7f4ff;--mute:#a398cc;--line:#32245e;
  --btn:linear-gradient(135deg,#ff2a85,#8b5cf6);--onbtn:#fff;
  --c0:#ff2a85;--c1:#00e5ff;--c2:#9eff00;--c3:#ff9e00;--c4:#9d4edd;
  --glow:0 0 24px rgba(157,78,221,.28);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px)
}
body.sk-cyber{
  --bg:#050b14;--dot:#0f253d;--panel:#0a1626;--panel2:#102238;--line:#1b3b61;
  --c0:#ff0055;--c1:#00f0ff;--c2:#ccff00;--c3:#ffaa00;--c4:#b829ea;
  --glow:0 0 28px rgba(0,240,255,.35)
}
body.sk-void{
  --bg:#040406;--dot:#16161f;--panel:#0c0c12;--panel2:#151520;--line:#26263a;
  --c0:#ff1e56;--c1:#00fff5;--c2:#7bff00;--c3:#ffac41;--c4:#c77dff;
  --glow:0 0 32px rgba(255,30,86,.35)
}
body.sk-gold{
  --bg:#140e04;--dot:#2e2009;--panel:#211707;--panel2:#2e210b;--line:#4d3712;
  --c0:#ff4d6d;--c1:#00f5d4;--c2:#fee440;--c3:#ff9e00;--c4:#f15bb5;
  --glow:0 0 32px rgba(254,228,64,.35)
}
body.sk-godmode{
  --bg:#090214;--dot:#2a0845;--panel:#160529;--panel2:#240c42;--line:#5a1b8a;
  --c0:#ff007f;--c1:#00ffff;--c2:#ffff00;--c3:#ff7700;--c4:#9900ff;
  --glow:0 0 45px rgba(255,0,127,.65)
}
body.sk-retro .cell, body.lv-shape-notched .cell{
  border-radius:6px!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.32),inset 0 -3px 0 rgba(0,0,0,.38),0 2px 8px rgba(0,0,0,.28)!important
}
body.sk-retro #grid, body.lv-shape-notched #grid{border-radius:14px!important}
body.lv-shape-squircle .cell{
  border-radius:18px!important;
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.42),inset 0 -4px 0 rgba(0,0,0,.25),0 4px 10px rgba(0,0,0,.24)!important
}
body.lv-shape-orb .cell{
  border-radius:50%!important;
  box-shadow:inset 0 2px 4px rgba(255,255,255,.48),inset 0 -4px 6px rgba(0,0,0,.3),0 4px 10px rgba(0,0,0,.26)!important
}
body.lv-shape-orb #grid{border-radius:26px!important}
body.lv-shape-jewel .cell{
  border-radius:22px 6px 22px 6px!important;
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.45),inset 0 -4px 0 rgba(0,0,0,.28),0 4px 10px rgba(0,0,0,.25)!important
}
body.lv-shape-pill .cell{
  border-radius:999px!important;
  box-shadow:inset 0 2px 3px rgba(255,255,255,.45),inset 0 -4px 5px rgba(0,0,0,.28),0 3px 9px rgba(0,0,0,.25)!important
}
body.lv-shape-frosted .cell{
  border-radius:15px!important;
  border:1px solid rgba(255,255,255,.28);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -6px 14px rgba(0,0,0,.26),0 6px 14px rgba(0,0,0,.28)!important
}

html,body{height:100%;margin:0;width:100%}
body{
  background:
    radial-gradient(circle at 50% 0%,color-mix(in srgb,var(--c0) 26%,transparent),transparent 58%),
    radial-gradient(circle at 85% 85%,color-mix(in srgb,var(--c3) 16%,transparent),transparent 55%),
    radial-gradient(var(--dot) 1.6px,transparent 1.8px) 0 0/22px 22px,
    var(--bg);
  color:var(--ink);
  font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;overflow:hidden;
  transition:box-shadow .3s,background .3s
}
body.frozen{box-shadow:inset 0 0 55px rgba(0,229,255,.55)}
.w{width:min(92vw,384px)}
.hd{display:flex;justify-content:space-between;align-items:center}
.brand{
  display:flex;align-items:center;gap:6px;
  font-size:1.35rem;font-weight:900;letter-spacing:-.5px;
  background:linear-gradient(90deg,var(--c0),var(--c3),var(--c1));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 2px 10px rgba(255,42,133,.35))
}
.ic{
  font:inherit;border:0;background:var(--panel);color:var(--ink);
  border-radius:11px;min-width:36px;height:33px;padding:0 9px;cursor:pointer;margin-left:5px;
  box-shadow:inset 0 0 0 1.5px var(--line),0 3px 10px rgba(0,0,0,.25);
  transition:transform .1s,box-shadow .15s;font-weight:bold;font-size:.82rem
}
.ic:active{transform:scale(.9)}
.lvl-pill{
  display:inline-flex;align-items:center;gap:4px;
  background:linear-gradient(90deg,var(--c2),var(--c1));color:#0d081c;
  font-weight:900;font-size:.74rem;padding:3px 9px;border-radius:99px;
  letter-spacing:.4px;box-shadow:0 0 14px rgba(158,255,0,.4)
}
.perk-strip{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;min-height:18px}
.pk-tag{
  font-size:.68rem;font-weight:900;padding:2px 8px;border-radius:99px;
  background:rgba(255,255,255,.07);color:var(--c1);border:1px solid rgba(0,229,255,.28)
}
.pk-tag.shield{color:var(--c2);border-color:rgba(158,255,0,.4);box-shadow:0 0 10px rgba(158,255,0,.2)}
.pk-tag.used{opacity:.35;text-decoration:line-through}

.coin-pill{
  display:inline-flex;align-items:center;gap:5px;
  background:var(--panel);color:#ffd166;font-weight:900;font-size:.82rem;
  padding:4px 10px;border-radius:99px;
  box-shadow:inset 0 0 0 1.5px rgba(255,209,102,.35),0 3px 12px rgba(0,0,0,.25)
}
.rank-pill{
  display:inline-flex;align-items:center;gap:5px;
  background:linear-gradient(90deg,rgba(255,42,133,.2),rgba(139,92,246,.2));
  color:#fff;font-weight:900;font-size:.76rem;
  padding:4px 10px;border-radius:99px;
  border:1.5px solid rgba(255,42,133,.45);
  box-shadow:0 0 14px rgba(255,42,133,.2)
}
.top{display:flex;justify-content:space-between;align-items:flex-end}
.top div{display:flex;flex-direction:column}
.top small{color:var(--mute);font-size:.7rem;font-weight:900;text-transform:uppercase;letter-spacing:.7px}
.top b{font-size:2rem;line-height:1;font-variant-numeric:tabular-nums;transition:transform .12s}
.pop-num{transform:scale(1.26)}
.low{color:#ff2a85;animation:pu .42s infinite alternate}
.frz{color:#00e5ff!important;text-shadow:0 0 14px rgba(0,229,255,.7)}
@keyframes pu{to{transform:scale(1.22)}}
.bar{height:9px;border-radius:99px;background:var(--panel2);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
#fill{height:100%;background:linear-gradient(90deg,var(--c1),var(--c4),var(--c0));transition:width .1s linear;box-shadow:0 0 12px rgba(255,42,133,.5)}
#fill.frz-bar{background:linear-gradient(90deg,#90f1ef,#00e5ff)}
.lvl-bar{height:7px;border-radius:99px;background:var(--panel2);overflow:hidden;margin-top:1px;box-shadow:inset 0 0 0 1px var(--line)}
#lvl-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--c2),var(--c3));transition:width .2s ease-out;box-shadow:0 0 10px rgba(158,255,0,.5)}
.board{position:relative}
#grid{
  display:grid;grid-template-columns:repeat(7,1fr);gap:5px;aspect-ratio:1;
  background:var(--panel);padding:8px;border-radius:20px;
  box-shadow:0 12px 34px rgba(0,0,0,.45),inset 0 0 0 2px var(--line),var(--glow);
  box-sizing:border-box;transition:box-shadow .25s,transform .2s
}
#grid.combo-glow{box-shadow:0 0 32px rgba(255,42,133,.65),inset 0 0 0 2px var(--c0)}
#fx{position:absolute;left:0;top:0;pointer-events:none;z-index:2}
.cell{
  border:0;border-radius:13px;font-size:1.36rem;padding:0;
  color:rgba(255,255,255,.98);text-shadow:0 1px 2px rgba(0,0,0,.38);
  box-shadow:inset 0 -3.5px 0 rgba(0,0,0,.24),inset 0 2px 0 rgba(255,255,255,.38),0 2px 7px rgba(0,0,0,.22);
  cursor:pointer;transition:transform .08s,filter .18s,border-radius .28s cubic-bezier(.22,1,.36,1),box-shadow .28s ease,background .28s ease;
  display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden
}
.cell::after{
  content:"";position:absolute;top:-40%;left:-40%;width:60%;height:60%;
  background:radial-gradient(circle,rgba(255,255,255,.35),transparent 70%);
  pointer-events:none
}
.cell:active{transform:scale(.8)}
.cell.n{animation:d .34s cubic-bezier(.34,1.56,.64,1)}
@keyframes d{0%{transform:translateY(-85%) scale(.55);opacity:0}70%{transform:translateY(6%) scale(1.05);opacity:1}100%{transform:none;opacity:1}}
.cell.sp-joker{background:conic-gradient(from 0deg,var(--c0),var(--c3),var(--c2),var(--c1),var(--c4),var(--c0))!important;animation:pulseSp 1s ease-in-out infinite alternate;box-shadow:0 0 14px rgba(255,42,133,.75)}
.cell.sp-ice{background:radial-gradient(circle at 30% 25%,#ffffff,#7ee8fa 45%,#00e5ff)!important;box-shadow:inset 0 -4px 0 rgba(0,119,182,.4),0 0 14px rgba(0,229,255,.8);animation:pulseSp 1s ease-in-out infinite alternate}
.cell.sp-bomb{background:radial-gradient(circle at 30% 25%,#6b5b95,#1e1538)!important;box-shadow:inset 0 -4px 0 rgba(0,0,0,.6),0 0 14px rgba(255,158,0,.75);animation:pulseSp 1s ease-in-out infinite alternate}
@keyframes pulseSp{from{transform:scale(.92) rotate(-3deg)}to{transform:scale(1.06) rotate(3deg)}}
.sh{animation:sh .34s}
@keyframes sh{20%{transform:translateX(-9px) rotate(-1.5deg)}50%{transform:translateX(9px) rotate(1.5deg)}80%{transform:translateX(-4px)}}
#grid.theme-morph{animation:morphGrid .52s cubic-bezier(.34,1.56,.64,1)}
#grid.theme-morph .cell{animation:morphCell .46s cubic-bezier(.34,1.56,.64,1)}
@keyframes morphGrid{
  0%{transform:scale(.95) rotate(-1deg)}
  55%{transform:scale(1.03) rotate(.8deg)}
  100%{transform:none}
}
@keyframes morphCell{
  0%{transform:scale(.76) rotate(-8deg)}
  65%{transform:scale(1.08) rotate(3deg)}
  100%{transform:none}
}
@media (prefers-reduced-motion:reduce){.cell.n,.sh,.low,.sp-joker,.sp-ice,.sp-bomb,#grid.theme-morph,#grid.theme-morph .cell{animation:none}}
.hint{color:var(--mute);font-size:.78rem;text-align:center;min-height:1.1em;font-weight:bold;letter-spacing:.2px}

#ov{
  position:fixed;inset:0;z-index:50;overflow:auto;display:flex;
  background:
    radial-gradient(circle at 50% 12%,rgba(255,42,133,.16),transparent 52%),
    radial-gradient(var(--dot) 1.6px,transparent 1.8px) 0 0/22px 22px,
    var(--bg);
  padding:env(safe-area-inset-top,12px) 14px 20px;box-sizing:border-box
}
#ov[hidden]{display:none}
.in{margin:auto;width:min(92vw,384px);display:flex;flex-direction:column;gap:8px;text-align:center;animation:fadeUp .26s ease-out}
@keyframes fadeUp{from{transform:translateY(14px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.logo-hero{
  font-size:2.3rem;font-weight:900;letter-spacing:-1px;margin:0;line-height:1.05;
  background:linear-gradient(90deg,#ff2a85,#ff9e00,#00e5ff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 4px 18px rgba(255,42,133,.35))
}
h1{margin:0;font-size:1.9rem;letter-spacing:-.5px}
.in p{margin:0;color:var(--mute);font-size:.86rem;line-height:1.35}
.in b{color:var(--ink)}
.rk{font-size:1.2rem;font-weight:900;color:var(--c0)!important;text-shadow:0 0 14px rgba(255,42,133,.4)}

.goal-banner{
  background:linear-gradient(135deg,var(--panel2),rgba(255,42,133,.14));
  border:1.5px solid rgba(255,42,133,.4);border-radius:14px;padding:8px 12px;
  display:flex;align-items:center;justify-content:space-between;text-align:left;gap:8px;
  box-shadow:0 4px 16px rgba(0,0,0,.25);cursor:pointer
}
.goal-banner small{display:block;color:var(--mute);font-size:.7rem;text-transform:uppercase;font-weight:900;letter-spacing:.5px}
.goal-banner b{font-size:.86rem;color:#fff}
.goal-badge{background:var(--c0);color:#fff;font-weight:900;font-size:.74rem;padding:4px 9px;border-radius:99px;white-space:nowrap}

.b{
  font:inherit;font-weight:900;padding:11px 15px;border-radius:14px;border:0;
  background:var(--btn);color:var(--onbtn);cursor:pointer;
  display:flex;flex-direction:column;gap:2px;
  box-shadow:0 6px 18px rgba(139,92,246,.3);
  transition:transform .1s,box-shadow .15s
}
.b:active{transform:scale(.97)}
.b:disabled{opacity:.42;cursor:not-allowed;transform:none;box-shadow:none}
.b small{font-weight:normal;opacity:.85;font-size:.76rem}
.b.g{background:var(--panel);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.b.card{
  text-align:left;background:var(--panel);color:var(--ink);
  box-shadow:0 4px 14px rgba(0,0,0,.25),inset 0 0 0 1.5px var(--line),inset 6px 0 0 var(--c4)
}
.b.card.hot{box-shadow:0 4px 14px rgba(255,42,133,.16),inset 0 0 0 1.5px var(--line),inset 6px 0 0 var(--c0)}
.b.card.ice{box-shadow:0 4px 14px rgba(0,229,255,.14),inset 0 0 0 1.5px var(--line),inset 6px 0 0 var(--c1)}
.b.card.grn{box-shadow:0 4px 14px rgba(158,255,0,.14),inset 0 0 0 1.5px var(--line),inset 6px 0 0 var(--c2)}
.b.card.gold{box-shadow:0 4px 14px rgba(255,209,102,.2),inset 0 0 0 1.5px rgba(255,209,102,.5),inset 6px 0 0 #ffd166}

.row{display:flex;gap:7px;justify-content:center}
.diff-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.diff-btn{
  font:inherit;font-size:.78rem;font-weight:900;padding:7px 4px;border-radius:12px;
  border:1.5px solid var(--line);background:var(--panel);color:var(--ink);
  cursor:pointer;transition:all .14s;display:flex;flex-direction:column;align-items:center;gap:2px
}
.diff-btn small{font-size:.66rem;font-weight:bold;color:var(--mute)}
.diff-btn.act{
  border-color:var(--c0);
  background:linear-gradient(160deg,var(--panel2),rgba(255,42,133,.2));
  box-shadow:0 0 16px rgba(255,42,133,.3);
  transform:translateY(-1px)
}
.diff-btn.act small{color:#ffd166}

.stat-box{
  background:var(--panel);border-radius:15px;padding:11px;
  box-shadow:inset 0 0 0 1.5px var(--line);
  display:flex;flex-direction:column;gap:5px;font-size:.86rem
}
.unlock-box{
  background:linear-gradient(135deg,rgba(158,255,0,.16),rgba(0,229,255,.16));
  border:2px solid var(--c2);border-radius:15px;padding:11px;
  box-shadow:0 0 24px rgba(158,255,0,.25);
  animation:popUnlock .45s cubic-bezier(.34,1.56,.64,1)
}
@keyframes popUnlock{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}

input{
  font:inherit;width:100%;box-sizing:border-box;text-align:center;padding:11px;
  border-radius:12px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);
  text-transform:uppercase;font-weight:bold;font-size:1.1rem
}
input.s{text-transform:none}
label{font-size:.8rem;color:var(--mute);font-weight:bold}
.badges{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:left;margin-top:4px}
.bdg{
  background:var(--panel);padding:9px 10px;border-radius:13px;
  box-shadow:inset 0 0 0 1.5px var(--line);font-size:.78rem;opacity:.45;
  display:flex;align-items:center;gap:8px
}
.bdg.on{opacity:1;box-shadow:inset 0 0 0 1.5px var(--c2),0 0 14px rgba(158,255,0,.15);background:linear-gradient(135deg,var(--panel),rgba(158,255,0,.12))}
.bdg span{font-size:1.3rem}

.roadmap{max-height:210px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;text-align:left;padding-right:4px}
.rm-item{
  background:var(--panel);border-radius:14px;padding:10px 12px;
  box-shadow:inset 0 0 0 1.5px var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px
}
.rm-item.unlocked{box-shadow:inset 0 0 0 1.5px var(--c2);background:linear-gradient(90deg,var(--panel),rgba(158,255,0,.09))}
.rm-item.locked{opacity:.65}
.rm-lvl{font-weight:900;font-size:.82rem;padding:4px 9px;border-radius:9px;background:var(--panel2);color:var(--c1);white-space:nowrap}
.rm-item.unlocked .rm-lvl{background:var(--c2);color:#0d081c}
.skin-btn{
  font:inherit;font-size:.76rem;font-weight:900;padding:6px 11px;border-radius:10px;border:0;
  background:var(--btn);color:#fff;cursor:pointer;white-space:nowrap
}
.skin-btn.eq{background:var(--c2);color:#0d081c}

.toast{
  position:fixed;top:14px;left:50%;transform:translateX(-50%);
  background:linear-gradient(90deg,var(--c0),var(--c4));color:#fff;
  padding:10px 18px;border-radius:99px;font-weight:900;font-size:.86rem;z-index:200;
  box-shadow:0 8px 24px rgba(255,42,133,.5);animation:tin .3s ease-out;white-space:nowrap
}
@keyframes tin{from{transform:translate(-50%,-30px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
</style>
</head>
<body>
<div class="w hd"><div style="display:flex;align-items:center"><span class="brand">CHAINPOP ⚡</span><span class="lvl-pill" id="lvl_badge" hidden>LVL 1</span></div><div><button class="ic" id="mu" aria-label="Ton" type="button">🔊</button><button class="ic" id="q" aria-label="Menü" type="button">✕</button></div></div>
<div class="w perk-strip" id="perk_strip"></div>
<div class="w top"><div><small id="lbl_pts">Punkte</small><b id="sc">0</b></div><div><small id="lbl_cb">Combo</small><b id="cb">x1</b></div><div style="align-items:flex-end"><small id="tlbl">Zeit</small><b id="tm">45</b></div></div>
<div class="w bar"><div id="fill"></div></div>
<div class="w lvl-bar" id="lvl_wrap" hidden><div id="lvl-fill"></div></div>
<div class="w board"><div id="grid"></div><canvas id="fx"></canvas></div>
<div class="w hint" id="info">&nbsp;</div>
<div id="ov" hidden></div>

<script>
const N=7,BM=5,JK=6,IC=7,$=i=>document.getElementById(i);
const SH_SETS=[
  ["♥","●","▲","■","★"],
  ["◆","●","✦","▲","⬟"],
  ["⚡","🔥","💧","🍀","⭐"],
  ["♦","♠","♣","♥","★"],
  ["◈","◉","△","▣","✿"]
];
const getShapes=()=>{
  if(cfg.mode==="arcade")return SH_SETS[(Math.max(1,lvl)-1)%SH_SETS.length];
  const stage=Math.floor(Math.max(0,sc)/SCORE_STEP);
  const seed=hash(String(cfg.mode||"solo")+":"+String(cfg.code||""));
  return SH_SETS[(seed+stage)%SH_SETS.length];
};
const AL="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const REVIVE_COST=150;

const DIFFS={
  easy:{cols:4,pen:1,time:48,coinMult:0.6,coinLabel:"0.6x 🪙"},
  normal:{cols:5,pen:2,time:42,coinMult:1.0,coinLabel:"1.0x 🪙"},
  hard:{cols:5,pen:4,time:32,coinMult:1.75,coinLabel:"1.75x 🪙"}
};

const REWARDS=[
  {lvl:1,type:"skin",skin:"default",ic:"🔮",deT:"Neon-Standard",enT:"Neon Default",deD:"Der klassische Basis-Look",enD:"Classic base style"},
  {lvl:2,type:"perk",ic:"🎖️",deT:"Zeit-Boost (+3s Start)",enT:"Time Boost (+3s start)",deD:"Dauerhaft +3s Zeit in jedem Solo-Spiel",enD:"Permanent +3s time in solo mode"},
  {lvl:3,type:"skin",skin:"cyber",ic:"💠",deT:"Skin: Cyber-Matrix",enT:"Skin: Cyber Matrix",deD:"Eiskaltes High-Tech Neon-Design",enD:"Ice-cold high-tech neon design"},
  {lvl:4,type:"perk",ic:"🌈",deT:"Perk: Start-Joker",enT:"Perk: Start Joker",deD:"Jede Runde startet mit einem Farb-Joker",enD:"Every round starts with a Color Joker"},

const ALL_SHAPES=["squircle","orb","pill","frosted","jewel"];

function getThemeByIndex(themeIdx, shapeOverride){
  const idx=((themeIdx%LVL_THEMES.length)+LVL_THEMES.length)%LVL_THEMES.length;
  const cycle=Math.floor(Math.max(0,themeIdx)/LVL_THEMES.length);
  const base=LVL_THEMES[idx];
  const shape=shapeOverride||ALL_SHAPES[(idx+cycle*2)%ALL_SHAPES.length];
  return {...base,shape};
}

function getLevelTheme(lv){
  const idx=(Math.max(1,lv)-1)%LVL_THEMES.length;
  const cycle=Math.floor((Math.max(1,lv)-1)/LVL_THEMES.length);
  const base=LVL_THEMES[idx];
  if(cycle===0)return base;
  return {...base,shape:ALL_SHAPES[(lv+cycle*2)%ALL_SHAPES.length]};
}

function checkDailyStreak(){

  const yest=new Date(Date.now()-86400000).toISOString().slice(0,10);
  B.streak=(B.lastDay===yest)?(B.streak||1)+1:1;
  B.lastDay=today;
  const bonus=Math.min(250,40+B.streak*20);
  B.coins=(B.coins||0)+bonus;

  sv();

function getArcadeSpec(l){
  const base=DIFFS[diff]||DIFFS.normal;

  const goal=Math.round((280 + (l-1)*145) * (diff==="hard"?1.2:diff==="easy"?0.85:1));
  return {cols,time,pen,goal};

function loop(){

function group(r,c){
  const v=g[r][c],seen=new Set([r*N+c]),q=[[r,c]];
  for(let i=0;i<q.length;i++){
    const[y,x]=q[i];
    for(const[dy,dx]of[[1,0],[-1,0],[0,1],[0,-1]]){
      const a=y+dy,b=x+dx;
      if(a>=0&&b>=0&&a<N&&b<N&&g[a][b]===v&&!seen.has(a*N+b)){seen.add(a*N+b);q.push([a,b])}
    }
  }
  return q;
}
function hasMove(){for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(g[r][c]>=BM||group(r,c).length>1)return true;return false}

function refill(q){
  const C=getCols();
  const cols=new Set(q.map(p=>p[1]));
  for(const c of cols){
    const keep=[];
    for(let r=N-1;r>=0;r--)if(g[r][c]!==-1)keep.push(g[r][c]);
    for(let r=N-1,i=0;r>=0;r--,i++){
      if(i<keep.length)g[r][c]=keep[i];
      else{g[r][c]=rs[c]()*C|0;nw.add(r*N+c)}
    }
  }
}

function tap(i){
  if(!run)return;au();
  const r=i/N|0,c=i%N,v=g[r][c],C=getCols();
  let q=[];

  if(v===BM){
    for(let y=r-1;y<=r+1;y++)for(let x=c-1;x<=c+1;x++)if(y>=0&&x>=0&&y<N&&x<N)q.push([y,x]);
    tn(200,.38,"square",.16,.2);tn(85,.45,"sawtooth",.14,.4);shake();vib(35);
    ringFx(r,c,"#ff9e00",95);
  }else if(v===JK){
    const cnt=[0,0,0,0,0];
    for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(g[y][x]<5)cnt[g[y][x]]++;
    const target=cnt.indexOf(Math.max(...cnt));
    q.push([r,c]);
    for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(g[y][x]===target)q.push([y,x]);
    [523,659,784,1047].forEach((f,idx)=>tn(f,.18,"sine",.15,0,idx*.04));
    shake();vib([20,30,40]);
    ringFx(r,c,"#ff2a85",130);
  }else if(v===IC){
    q.push([r,c]);
    freeze=5.0;
    [880,1175,1397].forEach((f,idx)=>tn(f,.22,"triangle",.14,0,idx*.05));
    vib(25);
    ringFx(r,c,"#00e5ff",100);
  }else{
    q=group(r,c);
    if(q.length<2){miss(r,c);return}
    if(q.length>=5)ringFx(r,c,getComputedStyle(document.documentElement).getPropertyValue("--c"+v),70);
  }

  const now=Date.now();
  if(now-last>1650)combo=1;
  const n=q.length,pts=n*n*combo,bonus=v<BM?Math.max(0,n-4):0;
  const prevStage=Math.floor(Math.max(0,sc)/SCORE_STEP);
  sc+=pts;t+=bonus;
  const nextStage=Math.floor(Math.max(0,sc)/SCORE_STEP);
  if(cfg.mode!=="arcade" && nextStage>prevStage){
    syncModeTheme(true);
  }
  if(v<BM)sPop(n,combo);

  const scEl=$("sc");scEl.classList.add("pop-num");setTimeout(()=>scEl.classList.remove("pop-num"),130);

  for(const[y,x]of q){fx(y,x,g[y][x]);g[y][x]=-1}

  if(v===IC)ft(tr("ftFreeze"),r,c,"#00e5ff",21);
  else if(v===JK)ft(tr("ftJoker")+pts,r,c,"#ff2a85",21);
  else ft("+"+pts+(bonus?" ⏱+"+bonus:""),r,c,"#fff");

  if(combo===5&&now-last<=1650){ft(tr("ftUnstop"),Math.max(1,r-1),c,"#ff9e00",20);unlock("c5")}
  if(sc>=500)unlock("p500");
  if(sc>=1500)unlock("p1500");
  if(n>=8)unlock("big8");

  combo=Math.min(5,combo+1);last=now;
  refill(q);

  if(v<BM){
    if(n>=8){g[r][c]=JK;nw.add(i);ft(tr("ftMkJoker"),Math.max(0,r-1),c,"#ff2a85",21)}
    else if(n===7){g[r][c]=IC;nw.add(i);ft(tr("ftMkIce"),Math.max(0,r-1),c,"#00e5ff",21)}
    else if(n===6){g[r][c]=BM;nw.add(i);ft(tr("ftMkBomb"),Math.max(0,r-1),c,"#ff9e00",21)}
  }

  if(!hasMove()){
    for(let c2=0;c2<N;c2++)for(let r2=0;r2<N;r2++){g[r2][c2]=rs[c2]()*C|0;nw.add(r2*N+c2)}
    ft(tr("ftShuffle"),3,3,"#00e5ff");
  }

  render();kick();
  checkArcadeLevelComplete();
}

  clearInterval(timer);
  timer=setInterval(()=>{
    if(freeze>0){
      freeze=Math.max(0,freeze-.1);
      render();return;
    }
    t-=.1;
    if(Date.now()-last>1650&&combo>1)combo=1;
    const s=Math.ceil(t);
    if(t<=5&&s>0&&s!==lsec){lsec=s;tn(880,.06,"square",.07)}
    if(t<=0){t=0;render();over();return}
    render();
  },100);
}

function start(c){
  const df=DIFFS[diff]||DIFFS.normal;
  const fairMode=(c.mode==="daily"||c.mode==="duel"||c.mode==="code");
  const timeBonus=(!fairMode && (B.arcadeLvl||1)>=2)?3:0;
  const baseT=(c.time||df.time)+timeBonus;

  cfg={
    cols:c.cols||df.cols,
    pen:c.pen!==undefined?c.pen:df.pen,
    time:baseT,
    maxTime:baseT,
    coinMult:c.coinMult!==undefined?c.coinMult:df.coinMult,
    ...c
  };
  au();sc=0;t=cfg.time;freeze=0;combo=1;last=0;used=0;lsec=0;run=true;
  shieldReady=(!fairMode && (B.arcadeLvl||1)>=6 && cfg.pen>0);

  activeThemeKey="";
  if(cfg.mode==="arcade"){
    if(!c.keepLvl){
      lvl=c.startLvl||(B.arcadeLvl||1);totalArcadeSc=0;
      const sp=getArcadeSpec(lvl);
      cfg.cols=sp.cols;cfg.time=sp.time+timeBonus;cfg.maxTime=sp.time+timeBonus;cfg.pen=sp.pen;
      t=cfg.time;lvlGoal=sp.goal;
    }
    applyLevelTheme(lvl,false);
  }else{
    syncModeTheme(false);
  }
  fresh();ov(null);
  renderPerks();
  updateHudText();
  fit();render();go();
}

function startNextArcadeLevel(){
  lvl++;
  const sp=getArcadeSpec(lvl);
  const timeBonus=(B.arcadeLvl||1)>=2?3:0;
  start({
    mode:"arcade",
    code:rc(),
    keepLvl:true,
    cols:sp.cols,
    time:sp.time+timeBonus,
    pen:sp.pen,
    coinMult:(DIFFS[diff]||DIFFS.normal).coinMult
  });
  lvlGoal=sp.goal;
  updateHudText();
  render();
}

function over(){
  run=false;freeze=0;document.body.classList.remove("frozen");grid.classList.remove("combo-glow");clearInterval(timer);tn(300,.3,"triangle",.15,.5);render();

  if(cfg.mode==="chill"&&!used){
    screen="over";
    ov('<h1>'+tr("chillTimeUp")+'</h1><p>'+tr("chillTimeUpSub",{sc})+'</p>'+bt("reviveFree",tr("reviveFree"),"card ice")+bt("end",tr("endRound"),"g"));
    return;
  }

  if((cfg.mode==="solo"||cfg.mode==="arcade")&&!used){
    screen="over";
    const canAfford=(B.coins||0)>=REVIVE_COST;
    const title=cfg.mode==="arcade"?tr("arcadeFail",{l:lvl}):tr("timeUp");
    const sub=cfg.mode==="arcade"?tr("arcadeFailSub",{sc,g:lvlGoal}):tr("timeUpSub",{sc});
    const revBtn=canAfford
      ? bt("reviveCoins",tr("revivePaid",{cost:REVIVE_COST,coins:B.coins||0}),"card hot")
      : '<button class="b g" disabled>'+tr("revivePoor",{cost:REVIVE_COST,coins:B.coins||0})+'</button>';
    ov('<h1>'+title+'</h1><p>'+sub+'</p>'+revBtn+bt("end",tr("endRound"),"g"));
    return;
  }

  fin();
}

function ov(h){const o=$("ov");if(h==null){o.hidden=true;return}o.hidden=false;o.innerHTML='<div class="in">'+h+'</div>';o.scrollTop=0}
const bt=(a,l,c="")=>'<button class="b '+c+'" type="button" data-a="'+a+'">'+l+'</button>';

$("ov").onclick=e=>{
  const btn=e.target.closest("[data-a]");
  if(btn){au();AC[btn.dataset.a]();return}
  const sk=e.target.closest("[data-skin]");
  if(sk){au();B.skin=sk.dataset.skin;sv();applySkin();rewards()}
};
$("mu").onclick=()=>{mute=!mute;$("mu").textContent=mute?"🔇":"🔊"};
$("q").onclick=()=>{run=false;freeze=0;document.body.classList.remove("frozen");grid.classList.remove("combo-glow");$("lvl_badge").hidden=true;$("perk_strip").innerHTML="";clearInterval(timer);menu()};

function menu(){
  screen="menu";
  applySkin();
  $("lvl_badge").hidden=true;
  $("perk_strip").innerHTML="";
  const uCount=Object.keys(B.ach).length;
  const al=B.arcadeLvl||1;
  const rewUnlocked=REWARDS.filter(r=>al>=r.lvl).length;
  const nextRew=REWARDS.find(r=>al<r.lvl);

  const topBar='<div style="display:flex;justify-content:space-between;align-items:center;gap:4px">'+
    '<span class="coin-pill">🪙 '+(B.coins||0)+'</span>'+
    '<span class="rank-pill">'+playerTitle()+'</span>'+
    '<button class="ic" type="button" style="margin:0" data-a="lang">'+(lang==="de"?"🇩🇪 DE":"🇬🇧 EN")+'</button>'+
  '</div>';

  let goalHtml="";
  if(nextRew){
    const rTitle=lang==="de"?nextRew.deT:nextRew.enT;
    goalHtml='<div class="goal-banner" data-a="rewards"><div><small>'+tr("nextGoalLbl",{l:nextRew.lvl})+'</small><b>'+nextRew.ic+' '+rTitle+'</b></div><span class="goal-badge">LVL '+al+' / '+nextRew.lvl+'</span></div>';
  }else{
    goalHtml='<div class="goal-banner"><div><b>'+tr("allUnlocked")+'</b></div><span class="goal-badge">MAX</span></div>';
  }

  const diffBar='<div class="diff-row">'+
    '<button class="diff-btn'+(diff==="easy"?" act":"")+'" type="button" data-a="dEasy"><span>'+tr("dEasy")+'</span><small>0.6x 🪙</small></button>'+
    '<button class="diff-btn'+(diff==="normal"?" act":"")+'" type="button" data-a="dNorm"><span>'+tr("dNorm")+'</span><small>1.0x 🪙</small></button>'+
    '<button class="diff-btn'+(diff==="hard"?" act":"")+'" type="button" data-a="dHard"><span>'+tr("dHard")+'</span><small>1.75x 🪙</small></button>'+
  '</div>';

  ov(topBar+'<div class="logo-hero">CHAINPOP ⚡</div>'+
  goalHtml+
  diffBar+
  bt("arcade",tr("mArcade",{l:al}),"card grn")+
  bt("daily",tr("mDaily"),"card hot")+
  bt("codeS",tr("mCode"),"card")+
  bt("duel",tr("mDuel"),"card ice")+
  bt("solo",tr("mSolo"),"card")+
  bt("chill",tr("mChill"),"card")+
  '<div class="row">'+
    '<button class="b g" type="button" style="flex:1;padding:10px 8px;font-size:.82rem" data-a="rewards">'+tr("mRewards",{u:rewUnlocked,tot:REWARDS.length})+'</button>'+
    '<button class="b g" type="button" style="flex:1;padding:10px 8px;font-size:.82rem" data-a="trophies">'+tr("mTrophies",{u:uCount,tot:L().ach.length})+'</button>'+
  '</div>'+
  '<p style="font-size:.76rem">'+tr("mBest",{s:B.solo||0,a:al,d:B.daily||0})+'</p>');
}

function rewards(){
  screen="rewards";
  const al=B.arcadeLvl||1;
  let list='<div class="roadmap">';
  for(const r of REWARDS){
    const unl=al>=r.lvl;
    const t=lang==="de"?r.deT:r.enT;
    const d=lang==="de"?r.deD:r.enD;
    let right='<span class="rm-lvl">'+(unl?'✓ LVL '+r.lvl:tr("lockedLvl",{l:r.lvl}))+'</span>';
    if(unl && r.type==="skin"){
      const isEq=(B.skin||"default")===r.skin;
      right='<button class="skin-btn'+(isEq?' eq':'')+'" type="button" data-skin="'+r.skin+'">'+(isEq?tr("equipped"):tr("equip"))+'</button>';
    }
    list+='<div class="rm-item '+(unl?'unlocked':'locked')+'"><div><div style="font-weight:900;font-size:.86rem">'+r.ic+' '+t+'</div><div style="font-size:.74rem;color:var(--mute);margin-top:2px">'+d+'</div></div>'+right+'</div>';
  }
  list+='</div>';
  ov('<h1>'+tr("rewTitle")+'</h1><p>'+tr("rewSub")+'</p>'+list+bt("menu",tr("backMenu"),"g"));
}

function trophies(){
  screen="trophies";
  let list='<div class="badges">';
  for(const a of L().ach){
    const on=!!B.ach[a.id];
    list+='<div class="bdg'+(on?' on':'')+'"><span>'+(on?a.ic:'🔒')+'</span><div><b>'+a.t+'</b><br>'+a.d+'</div></div>';
  }
  list+='</div>';
  ov('<h1>'+tr("tTitle")+'</h1><p>'+tr("tSub")+'</p>'+list+bt("menu",tr("backMenu"),"g"));
}

function ready(){
  screen="duel";
  const d=duel;
  ov('<h1>'+tr("rTitle",{r:d.r+1})+'</h1><p>'+tr("rTurn",{p:d.p+1})+'</p><p>'+(d.p?tr("rBeat",{s:d.s[d.r][0]}):tr("rNextNote"))+'</p>'+bt("dstart",tr("rGo")));
}

function dfin(){
  screen="duel";
  const d=duel;d.s[d.r][d.p]=sc;
  if(d.p===0){d.p=1;ov('<h1>'+sc+' '+tr("pts")+'!</h1><p>'+tr("dPass",{p:2,s:sc})+'</p>'+bt("dready",tr("dReady")));return}
  const[a,b]=d.s[d.r];if(a>b)d.w[0]++;else if(b>a)d.w[1]++;const done=d.w[0]===2||d.w[1]===2||d.r===2;
  let h='<h1>'+tr("rTitle",{r:d.r+1})+'</h1><p><b>'+a+'</b> : <b>'+b+'</b> — '+(a>b?tr("dP1"):b>a?tr("dP2"):tr("dTie"))+'</p><p>'+tr("dStand",{a:d.w[0],b:d.w[1]})+'</p>';
  if(done){
    const ta=d.s.reduce((x,r)=>x+r[0],0),tb=d.s.reduce((x,r)=>x+r[1],0),win=d.w[0]!==d.w[1]?(d.w[0]>d.w[1]?0:1):(ta>tb?0:tb>ta?1:-1);
    if(win>=0)unlock("win");
    h='<h1>'+(win<0?tr("dDraw"):tr("dWin",{w:win+1}))+'</h1><p>'+tr("dFinal",{w0:d.w[0],w1:d.w[1],t0:ta,t1:tb})+'</p>'+bt("duel",tr("dRematch"))+bt("menu",tr("menu"),"g");fanfare();
  }else h+=bt("dnext",tr("dNext"));
  ov(h);
}

function fin(){
  const m=cfg.mode;if(m==="duel")return dfin();
  screen="fin";
  $("lvl_badge").hidden=true;
  $("perk_strip").innerHTML="";

  const finalSc=m==="arcade"?(totalArcadeSc+sc):sc;
  const mult=cfg.coinMult||1.0;
  const earnedCoins=Math.max(3,Math.round((finalSc/25)*mult));
  B.coins=(B.coins||0)+earnedCoins;

  const nb=finalSc>(B[m]||0);if(nb)B[m]=finalSc;
  if(m==="arcade"&&lvl>(B.arcadeLvl||1))B.arcadeLvl=lvl;
  sv();

  let h='<h1>'+finalSc+'</h1><p class="rk">'+rank(finalSc)+'</p>';
  if(m==="arcade"){
    h+='<p>'+tr("arcadeRes",{l:lvl,r:B.arcadeLvl||lvl})+'</p>';
  }
  if(cfg.opp){
    const won=finalSc>cfg.opp;
    if(won)unlock("win");
    h+='<p><b>'+(won?tr("won"):finalSc<cfg.opp?tr("lost"):tr("tie"))+'</b>'+tr("opp",{o:cfg.opp})+'</p>';
  }
  h+='<p>'+(nb?tr("newRec"):tr("curRec",{r:B[m]||finalSc}))+'</p>'+
  '<p style="color:#ffd166;font-weight:bold">'+tr("coinsEarned",{e:earnedCoins,mult:mult,tot:B.coins})+'</p>'+
  bt("share",tr("btnShare"),"card hot")+
  bt("again",m==="code"?tr("btnAgainCode"):m==="arcade"?tr("btnAgainLvl",{l:lvl}):tr("btnAgain"))+
  bt("menu",tr("menu"),"g")+'<p id="msg"></p>';
  ov(h);(nb||(cfg.opp&&finalSc>cfg.opp))?fanfare():lose();
}

async function share(){
  let base="";try{base=location.href.split("?")[0].split("#")[0]}catch(e){}
  const finalSc=cfg.mode==="arcade"?(totalArcadeSc+sc):sc;
  const link=base?(base+"?c="+encodeURIComponent(cfg.code)+"&s="+finalSc):"";
  const s=tr("shareTxt",{d:cfg.mode==="daily"?tr("shareDaily"):"",rk:playerTitle(),sc:finalSc,c:cfg.code})+(link?tr("shareLink")+link:"");
  try{if(navigator.share){await navigator.share({title:tr("shareTitle"),text:s});return}}catch(e){}
  try{await navigator.clipboard.writeText(s);$("msg").textContent=tr("copied")}catch(e){$("msg").textContent=s}
}

const AC={
  menu,trophies,rewards,share,end:fin,lang:toggleLang,
  dEasy:()=>setDiff("easy"),dNorm:()=>setDiff("normal"),dHard:()=>setDiff("hard"),
  arcade:(sl)=>start({mode:"arcade",code:rc(),startLvl:typeof sl==="number"?sl:(B.arcadeLvl||1)}),
  nextArcade:startNextArcadeLevel,
  solo:()=>start({mode:"solo",code:rc(),label:tr("lblSolo")}),
  chill:()=>start({mode:"chill",code:rc(),pen:0,time:60,coinMult:0.5,label:tr("lblChill")}),
  daily:()=>start({mode:"daily",code:"TAG"+new Date().toISOString().slice(5,10).replace("-",""),cols:5,pen:2,time:45,coinMult:1.0,label:tr("lblDaily")}),
  again:()=>cfg.mode==="code"?start({...cfg,opp:sc}):cfg.mode==="daily"?AC.daily():cfg.mode==="arcade"?AC.arcade(lvl):AC[cfg.mode](),
  codeS:()=>{screen="codeS";ov('<h1>'+tr("cTitle")+'</h1><p>'+tr("cSub")+'</p><div><label>'+tr("cLblCode")+'</label><input id="ic" maxlength="6" placeholder="K7F2"></div><div><label>'+tr("cLblPts")+'</label><input class="s" id="io" inputmode="numeric" placeholder="0"></div>'+bt("codeGo",tr("cStart"))+bt("menu",tr("back"),"g"))},
  codeGo:()=>{const c=$("ic").value.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,6)||rc();start({mode:"code",code:c,opp:+$("io").value||0,cols:5,pen:2,time:45,coinMult:1.0,label:tr("lblCode")})},
  duel:()=>{duel={base:rc(),r:0,p:0,s:[[0,0],[0,0],[0,0]],w:[0,0]};ready()},
  dready:ready,dnext:()=>{duel.r++;duel.p=0;ready()},
  dstart:()=>start({mode:"duel",code:duel.base+duel.r,cols:5,pen:2,time:45,coinMult:1.0,label:tr("lblDuel",{r:duel.r+1,p:duel.p+1})}),
  reviveFree:()=>{used=1;t=15;lsec=0;run=true;ov(null);go()},
  reviveCoins:()=>{
    if((B.coins||0)<REVIVE_COST)return;
    B.coins-=REVIVE_COST;sv();
    used=1;t=10;lsec=0;run=true;
    [523,659,784].forEach((f,i)=>tn(f,.14,"triangle",.15,0,i*.06));
    ov(null);go();
  }
};

function checkUrl(){
  try{
    const p=new URLSearchParams(location.search);
    const c=p.get("c"),s=parseInt(p.get("s")||"0",10);
    if(c){
      const clean=c.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,6);
      if(clean){
        screen="challenge";
        const langBtn='<div style="display:flex;justify-content:flex-end"><button class="ic" type="button" style="margin:0" data-a="lang">'+(lang==="de"?"🇩🇪 DE":"🇬🇧 EN")+'</button></div>';
        ov(langBtn+'<h1>'+tr("chTitle")+'</h1><p>'+tr("chSub",{c:clean})+'</p><h1 style="color:var(--c0)">'+(s>0?s+' '+tr("pts"):tr("chBest"))+'</h1><p>'+tr("chDesc")+'</p>'+bt("urlGo",tr("chAccept"),"card hot")+bt("menu",tr("chMenu"),"g"));
        AC.urlGo=()=>start({mode:"code",code:clean,opp:s,cols:5,pen:2,time:45,coinMult:1.0,label:tr("lblCode")});
        return true;
      }
    }
  }catch(e){}
  return false;
}

lvl=B.arcadeLvl||1;
applySkin();
fresh();
applyLang();
checkDailyStreak();
if(!checkUrl())menu();
</script>
</body>
</html>
