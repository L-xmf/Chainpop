<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d081c">
<title>Chainpop</title>
<style>
:root{
  --bg:#0d081c;--dot:#231845;--panel:#171030;--panel2:#211742;
  --ink:#f7f4ff;--mute:#a398cc;--line:#32245e;
  --btn:linear-gradient(135deg,#ff2a85,#8b5cf6);--onbtn:#fff;
  --c0:#ff2a85;--c1:#00e5ff;--c2:#9eff00;--c3:#ff9e00;--c4:#9d4edd;
  --glow:0 0 24px rgba(157,78,221,.28);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px)
}
body.sk-cyber{
  --bg:#050b14;--dot:#0f253d;--panel:#0a1626;--panel2:#102238;--line:#1b3b61;
  --c0:#ff0055;--c1:#00f0ff;--c2:#ccff00;--c3:#ffaa00;--c4:#b829ea;
  --glow:0 0 28px rgba(0,240,255,.35)
}
body.sk-void{
  --bg:#040406;--dot:#16161f;--panel:#0c0c12;--panel2:#151520;--line:#26263a;
  --c0:#ff1e56;--c1:#00fff5;--c2:#7bff00;--c3:#ffac41;--c4:#c77dff;
  --glow:0 0 32px rgba(255,30,86,.35)
}
body.sk-gold{
  --bg:#140e04;--dot:#2e2009;--panel:#211707;--panel2:#2e210b;--line:#4d3712;
  --c0:#ff4d6d;--c1:#00f5d4;--c2:#fee440;--c3:#ff9e00;--c4:#f15bb5;
  --glow:0 0 32px rgba(254,228,64,.35)
}
body.sk-godmode{
  --bg:#090214;--dot:#2a0845;--panel:#160529;--panel2:#240c42;--line:#5a1b8a;
  --c0:#ff007f;--c1:#00ffff;--c2:#ffff00;--c3:#ff7700;--c4:#9900ff;
  --glow:0 0 45px rgba(255,0,127,.65)
}
body.sk-retro .cell{border-radius:4px!important;font-family:monospace;box-shadow:inset -3px -3px 0 rgba(0,0,0,.45),inset 3px 3px 0 rgba(255,255,255,.4)!important}
body.sk-retro #grid{border-radius:6px!important}

html,body{height:100%;margin:0;width:100%}
body{
  background:
    radial-gradient(circle at 50% 0%,rgba(157,78,221,.22),transparent 58%),
    radial-gradient(var(--dot) 1.6px,transparent 1.8px) 0 0/22px 22px,
    var(--bg);
  color:var(--ink);
  font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;overflow:hidden;
  transition:box-shadow .3s,background .3s
}
body.frozen{box-shadow:inset 0 0 55px rgba(0,229,255,.55)}
.w{width:min(92vw,384px)}
.hd{display:flex;justify-content:space-between;align-items:center}
.brand{
  display:flex;align-items:center;gap:6px;
  font-size:1.35rem;font-weight:900;letter-spacing:-.5px;
  background:linear-gradient(90deg,var(--c0),var(--c3),var(--c1));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 2px 10px rgba(255,42,133,.35))
}
.ic{
  font:inherit;border:0;background:var(--panel);color:var(--ink);
  border-radius:11px;min-width:36px;height:33px;padding:0 9px;cursor:pointer;margin-left:5px;
  box-shadow:inset 0 0 0 1.5px var(--line),0 3px 10px rgba(0,0,0,.25);
  transition:transform .1s,box-shadow .15s;font-weight:bold;font-size:.82rem
}
.ic:active{transform:scale(.9)}
.lvl-pill{
  display:inline-flex;align-items:center;gap:4px;
  background:linear-gradient(90deg,var(--c2),var(--c1));color:#0d081c;
  font-weight:900;font-size:.74rem;padding:3px 9px;border-radius:99px;
  letter-spacing:.4px;box-shadow:0 0 14px rgba(158,255,0,.4)
}
.perk-strip{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;min-height:18px}
.pk-tag{
  font-size:.68rem;font-weight:900;padding:2px 8px;border-radius:99px;
  background:rgba(255,255,255,.07);color:var(--c1);border:1px solid rgba(0,229,255,.28)
}
.pk-tag.shield{color:var(--c2);border-color:rgba(158,255,0,.4);box-shadow:0 0 10px rgba(158,255,0,.2)}
.pk-tag.used{opacity:.35;text-decoration:line-through}

.coin-pill{
  display:inline-flex;align-items:center;gap:5px;
  background:var(--panel);color:#ffd166;font-weight:900;font-size:.82rem;
  padding:4px 10px;border-radius:99px;
  box-shadow:inset 0 0 0 1.5px rgba(255,209,102,.35),0 3px 12px rgba(0,0,0,.25)
}
.rank-pill{
  display:inline-flex;align-items:center;gap:5px;
  background:linear-gradient(90deg,rgba(255,42,133,.2),rgba(139,92,246,.2));
  color:#fff;font-weight:900;font-size:.76rem;
  padding:4px 10px;border-radius:99px;
  border:1.5px solid rgba(255,42,133,.45);
  box-shadow:0 0 14px rgba(255,42,133,.2)
}
.top{display:flex;justify-content:space-between;align-items:flex-end}
.top div{display:flex;flex-direction:column}
.top small{color:var(--mute);font-size:.7rem;font-weight:900;text-transform:uppercase;letter-spacing:.7px}
.top b{font-size:2rem;line-height:1;font-variant-numeric:tabular-nums;transition:transform .12s}
.pop-num{transform:scale(1.26)}
.low{color:#ff2a85;animation:pu .42s infinite alternate}
.frz{color:#00e5ff!important;text-shadow:0 0 14px rgba(0,229,255,.7)}
@keyframes pu{to{transform:scale(1.22)}}
.bar{height:9px;border-radius:99px;background:var(--panel2);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
#fill{height:100%;background:linear-gradient(90deg,var(--c1),var(--c4),var(--c0));transition:width .1s linear;box-shadow:0 0 12px rgba(255,42,133,.5)}
#fill.frz-bar{background:linear-gradient(90deg,#90f1ef,#00e5ff)}
.lvl-bar{height:7px;border-radius:99px;background:var(--panel2);overflow:hidden;margin-top:1px;box-shadow:inset 0 0 0 1px var(--line)}
#lvl-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--c2),var(--c3));transition:width .2s ease-out;box-shadow:0 0 10px rgba(158,255,0,.5)}
.board{position:relative}
#grid{
  display:grid;grid-template-columns:repeat(7,1fr);gap:5px;aspect-ratio:1;
  background:var(--panel);padding:8px;border-radius:20px;
  box-shadow:0 12px 34px rgba(0,0,0,.45),inset 0 0 0 2px var(--line),var(--glow);
  box-sizing:border-box;transition:box-shadow .25s,transform .2s
}
#grid.combo-glow{box-shadow:0 0 32px rgba(255,42,133,.65),inset 0 0 0 2px var(--c0)}
#fx{position:absolute;left:0;top:0;pointer-events:none;z-index:2}
.cell{
  border:0;border-radius:13px;font-size:1.38rem;padding:0;
  color:rgba(255,255,255,.97);text-shadow:0 1px 3px rgba(0,0,0,.45);
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.28),inset 0 2.5px 0 rgba(255,255,255,.38),0 2px 6px rgba(0,0,0,.25);
  cursor:pointer;transition:transform .08s,filter .15s;
  display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden
}
.cell::after{
  content:"";position:absolute;top:-40%;left:-40%;width:60%;height:60%;
  background:radial-gradient(circle,rgba(255,255,255,.35),transparent 70%);
  pointer-events:none
}
.cell:active{transform:scale(.8)}
.cell.n{animation:d .34s cubic-bezier(.34,1.56,.64,1)}
@keyframes d{0%{transform:translateY(-85%) scale(.55);opacity:0}70%{transform:translateY(6%) scale(1.05);opacity:1}100%{transform:none;opacity:1}}
.cell.sp-joker{background:conic-gradient(from 0deg,var(--c0),var(--c3),var(--c2),var(--c1),var(--c4),var(--c0))!important;animation:pulseSp 1s ease-in-out infinite alternate;box-shadow:0 0 14px rgba(255,42,133,.75)}
.cell.sp-ice{background:radial-gradient(circle at 30% 25%,#ffffff,#7ee8fa 45%,#00e5ff)!important;box-shadow:inset 0 -4px 0 rgba(0,119,182,.4),0 0 14px rgba(0,229,255,.8);animation:pulseSp 1s ease-in-out infinite alternate}
.cell.sp-bomb{background:radial-gradient(circle at 30% 25%,#6b5b95,#1e1538)!important;box-shadow:inset 0 -4px 0 rgba(0,0,0,.6),0 0 14px rgba(255,158,0,.75);animation:pulseSp 1s ease-in-out infinite alternate}
@keyframes pulseSp{from{transform:scale(.92) rotate(-3deg)}to{transform:scale(1.06) rotate(3deg)}}
.sh{animation:sh .34s}
@keyframes sh{20%{transform:translateX(-9px) rotate(-1.5deg)}50%{transform:translateX(9px) rotate(1.5deg)}80%{transform:translateX(-4px)}}
@media (prefers-reduced-motion:reduce){.cell.n,.sh,.low,.sp-joker,.sp-ice,.sp-bomb{animation:none}}
.hint{color:var(--mute);font-size:.78rem;text-align:center;min-height:1.1em;font-weight:bold;letter-spacing:.2px}

#ov{
  position:fixed;inset:0;z-index:50;overflow:auto;display:flex;
  background:
    radial-gradient(circle at 50% 12%,rgba(255,42,133,.16),transparent 52%),
    radial-gradient(var(--dot) 1.6px,transparent 1.8px) 0 0/22px 22px,
    var(--bg);
  padding:env(safe-area-inset-top,12px) 14px 20px;box-sizing:border-box
}
#ov[hidden]{display:none}
.in{margin:auto;width:min(92vw,384px);display:flex;flex-direction:column;gap:8px;text-align:center;animation:fadeUp .26s ease-out}
@keyframes fadeUp{from{transform:translateY(14px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.logo-hero{
  font-size:2.3rem;font-weight:900;letter-spacing:-1px;margin:0;line-height:1.05;
  background:linear-gradient(90deg,#ff2a85,#ff9e00,#00e5ff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 4px 18px rgba(255,42,133,.35))
}
h1{margin:0;font-size:1.9rem;letter-spacing:-.5px}
.in p{margin:0;color:var(--mute);font-size:.86rem;line-height:1.35}
.in b{color:var(--ink)}
.rk{font-size:1.2rem;font-weight:900;color:var(--c0)!important;text-shadow:0 0 14px rgba(255,42,133,.4)}

.goal-banner{
  background:linear-gradient(135deg,var(--panel2),rgba(255,42,133,.14));
  border:1.5px solid rgba(255,42,133,.4);border-radius:14px;padding:8px 12px;
  display:flex;align-items:center;justify-content:space-between;text-align:left;gap:8px;
  box-shadow:0 4px 16px rgba(0,0,0,.25);cursor:pointer
}
.goal-banner small{display:block;color:var(--mute);font-size:.7rem;text-transform:uppercase;font-weight:900;letter-spacing:.5px}
.goal-banner b{font-size:.86rem;color:#fff}
.goal-badge{background:var(--c0);color:#fff;font-weight:900;font-size:.74rem;padding:4px 9px;border-radius:99px;white-space:nowrap}

.b{
  font:inherit;font-weight:900;padding:11px 15px;border-radius:14px;border:0;
  background:var(--btn);color:var(--onbtn);cursor:pointer;
  display:flex;flex-direction:column;gap:2px;
  box-shadow:0 6px 18px rgba(139,92,246,.3);
  transition:transform .1s,box-shadow .15s
}
.b:active{transform:scale(.97)}
.b:disabled{opacity:.42;cursor:not-allowed;transform:none;box-shadow:none}
.b small{font-weight:normal;opacity:.85;font-size:.76rem}
.b.g{background:var(--panel);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.b.card{
  text-align:left;background:var(--panel);color:var(--ink);
  box-shadow:0 4px 14px rgba(0,0,0,.25),inset 0 0 0 1.5px var(--line),inset 6px 0 0 var(--c4)
}
.b.card.hot{box-shadow:0 4px 14px rgba(255,42,133,.16),inset 0 0 0 1.5px var(--line),inset 6px 0 0 var(--c0)}
.b.card.ice{box-shadow:0 4px 14px rgba(0,229,255,.14),inset 0 0 0 1.5px var(--line),inset 6px 0 0 var(--c1)}
.b.card.grn{box-shadow:0 4px 14px rgba(158,255,0,.14),inset 0 0 0 1.5px var(--line),inset 6px 0 0 var(--c2)}
.b.card.gold{box-shadow:0 4px 14px rgba(255,209,102,.2),inset 0 0 0 1.5px rgba(255,209,102,.5),inset 6px 0 0 #ffd166}

.row{display:flex;gap:7px;justify-content:center}
.diff-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.diff-btn{
  font:inherit;font-size:.78rem;font-weight:900;padding:7px 4px;border-radius:12px;
  border:1.5px solid var(--line);background:var(--panel);color:var(--ink);
  cursor:pointer;transition:all .14s;display:flex;flex-direction:column;align-items:center;gap:2px
}
.diff-btn small{font-size:.66rem;font-weight:bold;color:var(--mute)}
.diff-btn.act{
  border-color:var(--c0);
  background:linear-gradient(160deg,var(--panel2),rgba(255,42,133,.2));
  box-shadow:0 0 16px rgba(255,42,133,.3);
  transform:translateY(-1px)
}
.diff-btn.act small{color:#ffd166}

.stat-box{
  background:var(--panel);border-radius:15px;padding:11px;
  box-shadow:inset 0 0 0 1.5px var(--line);
  display:flex;flex-direction:column;gap:5px;font-size:.86rem
}
.unlock-box{
  background:linear-gradient(135deg,rgba(158,255,0,.16),rgba(0,229,255,.16));
  border:2px solid var(--c2);border-radius:15px;padding:11px;
  box-shadow:0 0 24px rgba(158,255,0,.25);
  animation:popUnlock .45s cubic-bezier(.34,1.56,.64,1)
}
@keyframes popUnlock{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}

input{
  font:inherit;width:100%;box-sizing:border-box;text-align:center;padding:11px;
  border-radius:12px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);
  text-transform:uppercase;font-weight:bold;font-size:1.1rem
}
input.s{text-transform:none}
label{font-size:.8rem;color:var(--mute);font-weight:bold}
.badges{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:left;margin-top:4px}
.bdg{
  background:var(--panel);padding:9px 10px;border-radius:13px;
  box-shadow:inset 0 0 0 1.5px var(--line);font-size:.78rem;opacity:.45;
  display:flex;align-items:center;gap:8px
}
.bdg.on{opacity:1;box-shadow:inset 0 0 0 1.5px var(--c2),0 0 14px rgba(158,255,0,.15);background:linear-gradient(135deg,var(--panel),rgba(158,255,0,.12))}
.bdg span{font-size:1.3rem}

.roadmap{max-height:210px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;text-align:left;padding-right:4px}
.rm-item{
  background:var(--panel);border-radius:14px;padding:10px 12px;
  box-shadow:inset 0 0 0 1.5px var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px
}
.rm-item.unlocked{box-shadow:inset 0 0 0 1.5px var(--c2);background:linear-gradient(90deg,var(--panel),rgba(158,255,0,.09))}
.rm-item.locked{opacity:.65}
.rm-lvl{font-weight:900;font-size:.82rem;padding:4px 9px;border-radius:9px;background:var(--panel2);color:var(--c1);white-space:nowrap}
.rm-item.unlocked .rm-lvl{background:var(--c2);color:#0d081c}
.skin-btn{
  font:inherit;font-size:.76rem;font-weight:900;padding:6px 11px;border-radius:10px;border:0;
  background:var(--btn);color:#fff;cursor:pointer;white-space:nowrap
}
.skin-btn.eq{background:var(--c2);color:#0d081c}

.toast{
  position:fixed;top:14px;left:50%;transform:translateX(-50%);
  background:linear-gradient(90deg,var(--c0),var(--c4));color:#fff;
  padding:10px 18px;border-radius:99px;font-weight:900;font-size:.86rem;z-index:200;
  box-shadow:0 8px 24px rgba(255,42,133,.5);animation:tin .3s ease-out;white-space:nowrap
}
@keyframes tin{from{transform:translate(-50%,-30px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
</style>
</head>
<body>
<div class="w hd"><div style="display:flex;align-items:center"><span class="brand">CHAINPOP ⚡</span><span class="lvl-pill" id="lvl_badge" hidden>LVL 1</span></div><div><button class="ic" id="mu" aria-label="Ton" type="button">🔊</button><button class="ic" id="q" aria-label="Menü" type="button">✕</button></div></div>
<div class="w perk-strip" id="perk_strip"></div>
<div class="w top"><div><small id="lbl_pts">Punkte</small><b id="sc">0</b></div><div><small id="lbl_cb">Combo</small><b id="cb">x1</b></div><div style="align-items:flex-end"><small id="tlbl">Zeit</small><b id="tm">45</b></div></div>
<div class="w bar"><div id="fill"></div></div>
<div class="w lvl-bar" id="lvl_wrap" hidden><div id="lvl-fill"></div></div>
<div class="w board"><div id="grid"></div><canvas id="fx"></canvas></div>
<div class="w hint" id="info">&nbsp;</div>
<div id="ov" hidden></div>

<script>

const SH=["♥","●","▲","■","★"];

const REWARDS=[
  {lvl:1,type:"skin",skin:"default",ic:"🔮",deT:"Neon-Standard",enT:"Neon Default",deD:"Der klassische Basis-Look",enD:"Classic base style"},

  {lvl:35,type:"perk",ic:"🎯",deT:"Präzisions-Bonus",enT:"Precision Bonus",deD:"Erhöht die Chance auf Spezial-Boni",enD:"Boosts special item spawn rates"},

  {lvl:45,type:"perk",ic:"🛡️",deT:"Doppel-Schild",enT:"Double Shield",deD:"Zwei geschützte Fehlklicks pro Runde",enD:"Two protected misclicks per round"},
  {lvl:50,type:"skin",skin:"godmode",ic:"🔥",deT:"Skin: Supernova Nova",enT:"Skin: Supernova Nova",deD:"Leuchtender Plasma-Style ab Lvl 50",enD:"Glowing plasma style at Lvl 50"},
  {lvl:55,type:"perk",ic:"⚡",deT:"Master-Multiplikator",enT:"Master Multiplier",deD:"Permanent erhöhte Basis-Punktzahl",enD:"Permanently increased base score"},
  {lvl:60,type:"skin",skin:"godmode",ic:"👑",deT:"Elite-Legenden Rang",enT:"Elite Legend Rank",deD:"Der Elite-Status für die Schulspitze",enD:"The elite status for the top spot"},
  {lvl:65,type:"perk",ic:"🌈",deT:"Doppel-Joker Start",enT:"Double Joker Start",deD:"Zwei Farb-Joker direkt zu Beginn",enD:"Two color jokers right at start"},
  {lvl:70,type:"skin",skin:"godmode",ic:"💫",deT:"Skin: Galactic Void",enT:"Skin: Galactic Void",deD:"Galaktischer Sternenstaub-Look",enD:"Galactic stardust visual theme"},
